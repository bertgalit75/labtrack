name: EF Core 9 and Pomelo 9 qualification

on:
  pull_request:
    branches:
      - feat/kestrel-windows-hosting-prep
    paths:
      - 'src/backend/**'
      - 'dotnet-tools.json'
      - '.github/workflows/ef9-pomelo9-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore local tools
        run: dotnet tool restore
      - name: Restore solution
        run: dotnet restore LabTrack.sln
      - name: Build Release
        run: dotnet build LabTrack.sln -c Release --no-restore
      - name: Run tests
        run: dotnet test LabTrack.sln -c Release --no-build --logger "trx;LogFileName=ef9-pomelo9-tests.trx"
      - name: Verify EF migration model is synchronized
        run: dotnet ef migrations has-pending-model-changes --project src/backend/LabTrack.Infrastructure/LabTrack.Infrastructure.csproj --startup-project src/backend/LabTrack.WebApi/LabTrack.WebApi.csproj --configuration Release
      - name: Generate migration SQL without applying it
        run: dotnet ef migrations script 0 --project src/backend/LabTrack.Infrastructure/LabTrack.Infrastructure.csproj --startup-project src/backend/LabTrack.WebApi/LabTrack.WebApi.csproj --configuration Release --output ef9-pomelo9-initial.sql
      - name: Upload generated SQL for review
        uses: actions/upload-artifact@v4
        with:
          name: ef9-pomelo9-migration-sql
          path: ef9-pomelo9-initial.sql
          if-no-files-found: error
