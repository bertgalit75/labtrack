name: .NET 10 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Display SDK version
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore ./LabTrack.sln

      - name: Build solution
        run: dotnet build ./LabTrack.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ./LabTrack.sln --configuration Release --no-build --logger "trx;LogFileName=labtrack-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labtrack-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
